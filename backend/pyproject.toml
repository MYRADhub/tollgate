[project]
name = "tollgate"
version = "0.1.0"
description = "Autonomous accounts-payable agent: every invoice has to earn its payment."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "openai>=1.55",
  "boto3>=1.35",
  "pypdf>=5.1",
  "pypdfium2>=4.30",
  "reportlab>=4.2",
  "python-multipart>=0.0.12",
  "sse-starlette>=2.1",
  "rapidfuzz>=3.10",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tollgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
